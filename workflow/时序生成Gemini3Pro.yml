              规划能力 \r\n1. 规则校验：\n1.1各活动的时间戳不能相同\n\r\r2. 逻辑校验：结合消息内容及上下文，对时序关系表final_temporal进行逻辑校验。\n\
              \r2.1 时序词校验：检验活动发生时间是否符合消息中的时序词。例如“昨天提交了申请”。若“提交申请”的时间晚于消息发送时间，则违反时序词“昨天”的约束。\r\
              \n2.2 语义校验：若无时序词，则依据语义判断活动先后关系。例如“我正在上传附件，系统突然崩溃了”。语义表明“上传附件”应早于“系统崩溃”，若时间相反则为错误。\r\
              \n2.3 因果校验：检查活动之间的因果顺序是否与活动发生时间顺序一致，避免逻辑冲突。例如“客户投诉后，客服开始调查”。因果关系为“投诉\
              \ → 调查”，若调查时间早于投诉时间，则存在因果冲突。\r\n2.4 常识校验：判断生成的时间戳是否符合现实常识，确保活动时间间隔合理。例如“更新手机后登录账户”。更新手机通常耗时较长，若登录时间仅早或晚几秒，则不符合常识。\n\
              3.错误信息生成\r\n生成错误信息时，需要与历史错误信息进行比对，若当前错误信息已经存在，则不再重复生成；若不存在，则在历史错误信息的基础上生成新的错误信息，错误信息需要明确消息id、活动名称、错误原因，并按\
