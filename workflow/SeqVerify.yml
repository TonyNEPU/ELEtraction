        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: "import re\nimport json\nfrom datetime import datetime\n\ndef main(final_temporal_relation:\
          \ str) -> dict:\n    # ── 第一步：解码字面转义 + 提取 [ ... ] ───────────────────\n\
          \    pattern = r'.*?</think>'\n    cleaned = re.sub(pattern, '', final_temporal_relation,\
          \ flags=re.DOTALL).strip()\n\n    try:\n        cleaned = cleaned.encode('raw_unicode_escape').decode('unicode_escape')\n\
          \    except Exception:\n        pass\n\n    match = re.search(r'\\[.*\\\
          ]', cleaned, flags=re.DOTALL)\n    if not match:\n        return {\"result\"\
          : \"未找到 JSON 数组\"}\n\n    raw = match.group(0)\n\n    # ── 第二步：解析 JSON ──────────────────────────────────────\n\
          \    try:\n        records = json.loads(raw)\n    except json.JSONDecodeError\
          \ as e:\n        return {\"result\": f\"JSON 解析失败: {e}\"}\n\n    # ── 第三步：逐条校验\
          \ ───────────────────────────────────────\n    def parse_offset(offset_str:\
          \ str) -> float:\n        if not offset_str or offset_str.strip() in (\"\
          \", \"0\", \"0m\"):\n            return 0.0\n        s = offset_str.strip()\n\
          \        sign = -1 if s.startswith('-') else 1\n        s = s.lstrip('+-')\n\
          \        if s.endswith('d'):\n            return sign * float(s[:-1]) *\
          \ 1440\n        elif s.endswith('h'):\n            return sign * float(s[:-1])\
          \ * 60\n        elif s.endswith('m'):\n            return sign * float(s[:-1])\n\
          \        return 0.0\n\n    def parse_dt(s: str) -> datetime:\n        return\
          \ datetime.fromisoformat(s)\n\n    errors = []\n\n    for i, rec in enumerate(records):\n\
          \        idx       = i + 1\n        态        = rec.get(\"时态\", \"\")\n \
          \       发送时间  = rec.get(\"发送时间\", \"\")\n        时间戳    = rec.get(\"时间戳\"\
          , \"\")\n        粗偏移    = rec.get(\"粗粒度时间偏移量\", \"\")\n        细偏移    =\
          \ rec.get(\"细粒度时间偏移量\", \"\")\n\n        try:\n            t_send  = parse_dt(发送时间)\n\
          \            t_stamp = parse_dt(时间戳)\n        except ValueError as e:\n\
          \            errors.append(f\"第{idx}条：时间格式错误 ({e})\")\n            continue\n\
          \n        coarse_min = parse_offset(粗偏移)\n        fine_min   = parse_offset(细偏移)\n\
          \n        # 所有时态：细粒度偏移量必须 >= 0\n        if fine_min < 0:\n            errors.append(f\"\
          第{idx}条 [{态}]：细粒度偏移量 '{细偏移}' 应大于或等于 0（当前解析为 {fine_min}m）\")\n\n        if\
          \ 态 == \"Before\":\n            if coarse_min >= 0:\n                errors.append(f\"\
          第{idx}条 [{态}]：粗粒度偏移量 '{粗偏移}' 应为负数（当前解析为 {coarse_min}m）\")\n            if\
          \ t_stamp >= t_send:\n                errors.append(f\"第{idx}条 [{态}]：时间戳\
          \ {时间戳} 应早于发送时间 {发送时间}\")\n\n        elif 态 == \"Overlap\":\n          \
          \  if coarse_min != 0:\n                errors.append(f\"第{idx}条 [{态}]：粗粒度偏移量\
          \ '{粗偏移}' 应为 0（当前解析为 {coarse_min}m）\")\n            if t_stamp < t_send:\n\
          \                errors.append(f\"第{idx}条 [{态}]：时间戳 {时间戳} 应等于或晚于发送时间 {发送时间}\"\
          )\n\n        elif 态 == \"After\":\n            if coarse_min <= 0:\n   \
          \             errors.append(f\"第{idx}条 [{态}]：粗粒度偏移量 '{粗偏移}' 应为正数（当前解析为 {coarse_min}m）\"\
          )\n            if t_stamp <= t_send:\n                errors.append(f\"\
          第{idx}条 [{态}]：时间戳 {时间戳} 应晚于发送时间 {发送时间}\")\n\n    if errors:\n        return\
          \ {\"result\": \"\\n\".join(errors)}\n\n    return {\"result\": \"格式无问题\"\
          }"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 代码执行
        type: code
        variables:
